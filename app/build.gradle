plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.kogay.evamax'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.kogay.evamax'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подписываем отладочным ключом, чтобы APK можно было сразу ставить на устройство
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

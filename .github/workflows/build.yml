name: Build APK

on:
  push:
    paths-ignore: ['voice-urls.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: eva-max-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk eva-max.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eva-max.apk --target "$GITHUB_SHA" --title "Ева и Макс — последняя сборка" --notes "Сборка ${GITHUB_SHA::7}. Скачайте eva-max.apk ниже."
